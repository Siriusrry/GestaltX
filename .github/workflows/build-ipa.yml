name: Build audited IPA

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: audited-ipa
  cancel-in-progress: false

env:
  SOURCE_COMMIT: 601be665cf31a94d80480de2bdb2f2ac98829e26
  SOURCE_TREE: 855541d9f29b9a393131a79242468bfaec7a5b09
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - name: Check out audited source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: huamidev/GestaltX
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false

      - name: Verify source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          test -z "$(git status --porcelain)"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Verify documents, imports, cache layouts and embedded JavaScript
        shell: bash
        run: |
          set -euo pipefail
          {
            common=(GestaltX/GestaltDocument.swift GestaltX/Capabilities.swift GestaltX/DeviceCacheOptions.swift GestaltX/MobileGestaltCacheLayout.swift)
            swiftc -parse-as-library "${common[@]}" tests/DocumentTests.swift -o "$RUNNER_TEMP/DocumentTests"
            "$RUNNER_TEMP/DocumentTests"
            swiftc -parse-as-library Shared/SharedPlistInbox.swift tests/SharedPlistInboxTests.swift -o "$RUNNER_TEMP/SharedPlistInboxTests"
            "$RUNNER_TEMP/SharedPlistInboxTests"
            swiftc -parse-as-library Shared/SharedPlistInbox.swift GestaltX/DevicePlistIdentity.swift tests/DevicePlistIdentityTests.swift -o "$RUNNER_TEMP/DevicePlistIdentityTests"
            "$RUNNER_TEMP/DevicePlistIdentityTests"
            swiftc -parse-as-library "${common[@]}" Shared/SharedPlistInbox.swift GestaltX/DeviceBoundPlist.swift tests/DeviceBoundPlistTests.swift -o "$RUNNER_TEMP/DeviceBoundPlistTests"
            "$RUNNER_TEMP/DeviceBoundPlistTests"
            swiftc -parse-as-library GestaltX/AdvancedUnlockSequence.swift tests/AdvancedUnlockTests.swift -o "$RUNNER_TEMP/AdvancedUnlockTests"
            "$RUNNER_TEMP/AdvancedUnlockTests"
            node scripts/verify_respring.mjs
          } 2>&1 | tee "$RUNNER_TEMP/tests.log"

      - name: Build unsigned device application
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project GestaltX.xcodeproj \
            -scheme GestaltX \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -disableAutomaticPackageResolution \
            -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Package IPA and record build inputs
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/artifacts
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/ipa-staging/Payload" "$ARTIFACT_DIR"
          ditto "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/GestaltX.app" "$RUNNER_TEMP/ipa-staging/Payload/GestaltX.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/ipa-staging/Payload" "$ARTIFACT_DIR/GestaltX-1.0.3-601be66-unsigned.ipa"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, plistlib, subprocess, zipfile
          out = pathlib.Path(os.environ["ARTIFACT_DIR"])
          def command(*args):
              return subprocess.check_output(args, text=True).strip()
          source = command("git", "rev-parse", "HEAD")
          assert source == os.environ["SOURCE_COMMIT"]
          assert command("git", "rev-parse", "HEAD^{tree}") == os.environ["SOURCE_TREE"]
          ipa = next(out.glob("*.ipa"))
          with zipfile.ZipFile(ipa) as archive:
              bundles = [
                  ("Payload/GestaltX.app", "GestaltX", "com.huami.gestultx"),
                  ("Payload/GestaltX.app/PlugIns/GestaltXShare.appex", "GestaltXShare", "com.huami.gestultx.ShareExtension")
              ]
              for bundle, executable, identifier in bundles:
                  assert bundle + "/" + executable in archive.namelist()
                  info = plistlib.loads(archive.read(bundle + "/Info.plist"))
                  assert info["CFBundleShortVersionString"] == "1.0.3"
                  assert info["CFBundleVersion"] == "11100017"
                  assert info["CFBundleIdentifier"] == identifier
          paths = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          records = []
          for raw_path in paths:
              if raw_path:
                  path = pathlib.Path(os.fsdecode(raw_path))
                  records.append(hashlib.sha256(path.read_bytes()).hexdigest() + "  " + path.as_posix())
          (out / "source-files.sha256").write_text("\n".join(records) + "\n")
          metadata = {
              "upstream_repository": "https://github.com/huamidev/GestaltX",
              "source_commit": source,
              "source_tree": command("git", "rev-parse", "HEAD^{tree}"),
              "workflow_repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_commit": os.environ["GITHUB_SHA"],
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "run_url": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
              "xcode": command("xcodebuild", "-version"),
              "iphoneos_sdk": command("xcrun", "--sdk", "iphoneos", "--show-sdk-version"),
              "configuration": "Release",
              "signature": "unsigned; re-sign the app and embedded share extension with a common usable App Group before installation",
              "device_compatibility": "not device-tested for this source commit",
              "embedded_extension": "PlugIns/GestaltXShare.appex",
              "ipa_sha256": hashlib.sha256(ipa.read_bytes()).hexdigest()
          }
          (out / "build-info.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY
          cp "$RUNNER_TEMP/build.log" "$ARTIFACT_DIR/build.log"
          cp "$RUNNER_TEMP/tests.log" "$ARTIFACT_DIR/tests.log"
          otool -L "$RUNNER_TEMP/ipa-staging/Payload/GestaltX.app/GestaltX" > "$ARTIFACT_DIR/linked-libraries.txt"
          otool -L "$RUNNER_TEMP/ipa-staging/Payload/GestaltX.app/PlugIns/GestaltXShare.appex/GestaltXShare" >> "$ARTIFACT_DIR/linked-libraries.txt"
          cd "$ARTIFACT_DIR"
          shasum -a 256 *.ipa build-info.json source-files.sha256 build.log tests.log linked-libraries.txt > SHA256SUMS

      - name: Attest IPA build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ runner.temp }}/artifacts/*.ipa

      - name: Upload IPA and build records
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GestaltX-1.0.3-601be66-unsigned
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failed-build-log
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/tests.log
          if-no-files-found: ignore
          retention-days: 3
