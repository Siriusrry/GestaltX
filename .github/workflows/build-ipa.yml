name: Build audited IPA

on:
  workflow_dispatch:
  push:
    branches:
      - wallet-probe

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: wallet-probe-ipa
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Run WalletProbe unit and redaction tests
        shell: bash
        run: |
          set -euo pipefail
          xcrun --sdk macosx clang \
            -fobjc-arc \
            -Wall -Wextra -Wno-unused-parameter -Werror \
            -framework Foundation \
            WalletProbe/ProbeFS.m \
            WalletProbe/WQAccess.m \
            WalletProbe/ProbeRunner.m \
            tests/WalletProbeTests.m \
            -o "$RUNNER_TEMP/WalletProbeTests"
          "$RUNNER_TEMP/WalletProbeTests"

      - name: Build unsigned WalletProbe application
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project WalletProbe.xcodeproj \
            -scheme WalletProbe \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -disableAutomaticPackageResolution \
            -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Package IPA and record build inputs
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/artifacts
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/ipa-staging/Payload" "$ARTIFACT_DIR"
          ditto "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/WalletProbe.app" "$RUNNER_TEMP/ipa-staging/Payload/WalletProbe.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/ipa-staging/Payload" "$ARTIFACT_DIR/WalletProbe-0.1.0-unsigned.ipa"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile
          out = pathlib.Path(os.environ["ARTIFACT_DIR"])
          def command(*args):
              return subprocess.check_output(args, text=True).strip()
          source = command("git", "rev-parse", "HEAD")
          assert source == os.environ["GITHUB_SHA"]
          ipa = next(out.glob("*.ipa"))
          with zipfile.ZipFile(ipa) as archive:
              assert "Payload/WalletProbe.app/WalletProbe" in archive.namelist()
              assert "Payload/WalletProbe.app/Info.plist" in archive.namelist()
          paths = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          records = []
          for raw_path in paths:
              if raw_path:
                  path = pathlib.Path(os.fsdecode(raw_path))
                  records.append(hashlib.sha256(path.read_bytes()).hexdigest() + "  " + path.as_posix())
          (out / "source-files.sha256").write_text("\n".join(records) + "\n")
          metadata = {
              "app": "WalletProbe",
              "source_commit": source,
              "source_tree": command("git", "rev-parse", "HEAD^{tree}"),
              "workflow_repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_commit": os.environ["GITHUB_SHA"],
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "run_url": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
              "xcode": command("xcodebuild", "-version"),
              "iphoneos_sdk": command("xcrun", "--sdk", "iphoneos", "--show-sdk-version"),
              "configuration": "Release",
              "bundle_id": "com.siriusrry.walletprobe",
              "dedicated_group": "group.com.siriusrry.walletprobe",
              "signature": "unsigned; requires local re-signing with dedicated App Group before installation",
              "ipa_sha256": hashlib.sha256(ipa.read_bytes()).hexdigest()
          }
          (out / "build-info.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY
          cp "$RUNNER_TEMP/build.log" "$ARTIFACT_DIR/build.log"
          cd "$ARTIFACT_DIR"
          shasum -a 256 *.ipa build-info.json source-files.sha256 build.log > SHA256SUMS

      - name: Attest IPA build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ runner.temp }}/artifacts/*.ipa

      - name: Upload IPA and build records
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WalletProbe-0.1.0-unsigned
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failed-build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 3
